services:
  commet:
    container_name: commet-web
    build:
      context: .
      dockerfile: Dockerfile
      target: prebuilt
    image: commet-web:prebuilt
    restart: unless-stopped
    ports:
      - "${COMMET_PORT:-${PORT:-8080}}:80"
    environment:
      - DEFAULT_HOMESERVER=${DEFAULT_HOMESERVER:-matrix.org}
      - CALENDAR_WIDGET=${CALENDAR_WIDGET:-calendar-widget.commet.chat}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
